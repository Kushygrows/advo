name: Build Advo Desktop App

# Builds real Windows and Linux installers on GitHub's own native runners
# (not cross-compiled). Every push to main uploads downloadable build
# artifacts to the Actions run. Pushing a version tag (e.g. v1.0.0) also
# publishes those installers to a GitHub Release automatically.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    # Runs the Playwright regression suite against advo.html on every push,
    # before anything gets built. This is the real replacement for the old
    # "Advo Nightly Regression QA" scheduled task, which was structurally
    # broken from the start (every scheduled-task run starts in a fresh,
    # empty environment with no copy of the repo). A push-triggered CI job
    # doesn't have that problem -- it checks out the real repo every time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          pip install -r tests/requirements.txt
          playwright install --with-deps chromium

      - name: Run regression suite
        run: python3 tests/run_regression.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Linux installers
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows installers
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (every push, for testing before a release)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: advo-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
